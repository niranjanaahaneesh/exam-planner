<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#2b2b33; --bar:#c9ccd6; --grid:#e1e5ea; --mut:#6f7482;
    --green:#5fc35a; --green-d:#2f7d32; --green-l:#9be08f;
    --pink:#f4a6b8; --clay:#c4713b; --hl:#fff1a8;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    font-family:"Pixelify Sans", ui-monospace, monospace; line-height:1.4;
    background-color:#fbfcfd;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
  }
  main { max-width:980px; margin:0 auto; padding:20px 14px 60px; }
  .narrow { max-width:560px; margin:0 auto; }
  .mut { color:var(--mut); } .small { font-size:.85rem; }
  :focus-visible { outline:3px solid var(--clay); outline-offset:2px; }

  /* window panels, like the reference image */
  .win { background:#fff; border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); margin-bottom:18px; }
  .tb { display:flex; justify-content:space-between; align-items:center; background:var(--bar); border-bottom:2px solid var(--ink); padding:3px 8px; }
  .x { width:20px; height:20px; padding:0; border:2px solid var(--ink); background:#fff; font:inherit; font-size:.8rem; line-height:1; cursor:pointer; }
  .x:hover { background:var(--pink); }
  .bd { padding:14px; }

  /* pixel buttons */
  .px {
    display:inline-block; font:inherit; color:inherit; text-decoration:none; cursor:pointer;
    background:#fff; border:2px solid var(--ink); padding:10px 16px; box-shadow:0 4px 0 var(--ink);
  }
  .px:hover { background:var(--pink); }
  .px:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  .mini { padding:2px 8px; font-size:.85rem; box-shadow:0 2px 0 var(--ink); }
  .mini:active { transform:translateY(1px); box-shadow:0 1px 0 var(--ink); }
  .big { display:block; width:100%; font-size:1.15rem; padding:16px; margin-top:16px; text-align:left; }

  /* home */
  .home { max-width:440px; margin:8vh auto 0; }
  .hi { font-size:1.5rem; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
  .cur { animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .cur { animation:none; } }

  /* progress bars */
  .prow { margin-bottom:18px; }
  .ph { display:flex; justify-content:space-between; margin-bottom:4px; }
  .dot { display:inline-block; width:10px; height:10px; border:2px solid var(--ink); margin-right:8px; }
  .bar { display:flex; gap:3px; padding:4px; border:2px solid var(--ink); border-radius:6px; background:#fff; }
  .seg { flex:1; height:16px; background:#eceef2; }
  .seg.on { background:var(--green); box-shadow:inset 0 3px 0 var(--green-l), inset 0 -3px 0 var(--green-d); }

  /* planner */
  .planner { display:grid; grid-template-columns:1fr 210px; gap:18px; align-items:start; }
  .side { position:sticky; top:12px; }
  @media (max-width:720px) { .planner { grid-template-columns:1fr; } .side { order:-1; position:static; } }
  .wk { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input, select { font:inherit; color:inherit; padding:5px 8px; border:2px solid var(--ink); background:#fff; border-radius:0; }
  .day { border:2px solid var(--ink); margin-bottom:10px; background:#fff; }
  .dh { width:100%; display:flex; justify-content:space-between; gap:8px; padding:9px 12px; border:0; background:#f4f5f8; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .day.open .dh { background:var(--bar); }
  .now { background:var(--pink); border:2px solid var(--ink); padding:0 6px; font-weight:400; font-size:.8rem; margin-left:6px; }
  .slots { padding:10px 12px; border-top:2px solid var(--ink); }
  .slot { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:6px 8px; margin-bottom:6px; border:2px solid var(--grid); background:#fff; transition:opacity .15s; }
  .slot .t { width:68px; font-weight:600; }
  .slot .nm { flex:1 1 120px; min-width:0; word-break:break-word; }
  .slot.done .nm { text-decoration:line-through; color:var(--mut); }
  .tag { font-size:.8rem; padding:0 6px; border:2px solid var(--ink); }
  .slot.hit { background:var(--hl); border-color:var(--ink); }
  .slot.dim { opacity:.3; }
  .slot input[type=checkbox] { width:18px; height:18px; accent-color:var(--green-d); }
  .slot.edit input[name=title] { flex:1 1 140px; }
  .add { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .add input[name=title] { flex:1 1 160px; }
  .sub { display:flex; align-items:center; width:100%; padding:6px 8px; margin-bottom:4px; border:2px solid transparent; background:transparent; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .sub:hover, .sub.on { border-color:var(--ink); background:var(--hl); }
  .erow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 0; border-bottom:2px dashed var(--grid); }
  .erow .nm { flex:1 1 150px; }
  .left { font-weight:600; }
  .soon { background:var(--pink); border:2px solid var(--ink); padding:0 6px; }
</style>
</head>
<body>
<main id="app"></main>

<script>
  // ---- Edit this list to match your own subjects ----
  const SUBJECTS = ["Network Theory","Physics","Maths","Basic Engineering","EVS"];
  const COLORS = ["#f4a6b8","#a8d8a2","#f7c98b","#a9c7f0","#d4b8ec","#f2e08a","#9fdcd3","#e3b5a0"];

  // ---- Saving: tasks are kept in the browser's localStorage ----
  const KEY = "exam-planner-v2";
  let tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} };

  // Exam dates are kept separately: { "Maths": "2026-12-05", ... }
  const EKEY = "exam-dates-v1";
  let exams = {};
  try { exams = JSON.parse(localStorage.getItem(EKEY)) || {}; } catch (e) {}
  const saveExams = () => { try { localStorage.setItem(EKEY, JSON.stringify(exams)); } catch (e) {} };

  // ---- Small helpers ----
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  const today = () => ymd(new Date());
  const daysLeft = s => {
    const [y, m, d] = s.split("-").map(Number), [ty, tm, td] = today().split("-").map(Number);
    return Math.round((Date.UTC(y, m-1, d) - Date.UTC(ty, tm-1, td)) / 86400000);
  };
  const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return ymd(new Date(y, m-1, d+n)); };
  const label = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-GB", {weekday:"short", day:"2-digit", month:"short"}); };
  const fmt = t => { const [h,m] = t.split(":").map(Number); return (h%12||12) + ":" + pad(m) + (h<12 ? " am" : " pm"); };
  const colorOf = s => COLORS[Math.max(0, SUBJECTS.indexOf(s)) % COLORS.length];
  const SLOTS = []; for (let h = 6; h < 24; h++) for (const m of [0, 30]) SLOTS.push(pad(h) + ":" + pad(m));
  const subjOpts = sel => SUBJECTS.map(s => `<option${s===sel?" selected":""}>${esc(s)}</option>`).join("");
  const slotOpts = sel => SLOTS.map(t => `<option value="${t}"${t===sel?" selected":""}>${fmt(t)}</option>`).join("");

  const win = (title, body) => `<section class="win"><div class="tb"><span>${title}</span><button class="x" data-go aria-label="Close and go home">x</button></div><div class="bd">${body}</div></section>`;
  const back = `<p><button class="px mini" data-page="home">&lt; home</button></p>`;
  const heart = `<svg viewBox="0 0 7 6" width="28" height="24" shape-rendering="crispEdges" fill="#f4a6b8" stroke="none"><path d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1zM2 4h3v1H2zM3 5h1v1H3z"/></svg>`;

  // ---- Page state ----
  let viewStart = today(), openDay = today(), editId = null, pinned = null, delId = null;
  const app = document.getElementById("app");

  // ---- Pages ----
  function viewHome() {
    app.innerHTML = `<div class="home">` + win("study_buddy.exe",
      `<p class="hi">${heart} hi! ready to study<span class="cur">_</span></p>
       <p class="mut" style="margin:0">pick where to go:</p>
       <button class="px big" data-page="progress">&gt; subject wise progress</button>
       <button class="px big" data-page="planner">&gt; date-wise to-do list</button>
       <button class="px big" data-page="timetable">&gt; timetable</button>`) + `</div>`;
  }

  function viewProgress() {
    const rows = SUBJECTS.map(s => {
      const all = tasks.filter(t => t.subject === s), done = all.filter(t => t.done).length;
      let n = all.length ? Math.round(done / all.length * 10) : 0;
      if (done > 0 && n === 0) n = 1;
      if (done < all.length && n === 10) n = 9;
      const segs = Array.from({length:10}, (_, i) => `<span class="seg${i<n?" on":""}"></span>`).join("");
      return `<div class="prow"><div class="ph"><span><i class="dot" style="background:${colorOf(s)}"></i>${esc(s)}</span>
        <span class="mut">${all.length ? done + "/" + all.length + " done" : "no tasks yet"}</span></div>
        <div class="bar" role="img" aria-label="${esc(s)}: ${done} of ${all.length} done">${segs}</div></div>`;
    }).join("");
    app.innerHTML = `<div class="narrow">${back}` + win("progress.exe", rows + `<p class="mut small" style="margin:0">bars fill up as you tick tasks off in the date-wise list.</p>`) + `</div>`;
  }

  function viewTimetable() {
    const rows = SUBJECTS.map(s => ({ s, d: exams[s] || "" }))
      .sort((a, b) => (a.d || "9999").localeCompare(b.d || "9999"))
      .map(({ s, d }) => {
        let note = `<span class="mut">no date yet</span>`;
        if (d) {
          const n = daysLeft(d);
          note = n < 0 ? `<span class="mut">exam over</span>`
            : n === 0 ? `<span class="soon">today!</span>`
            : `<span class="left${n <= 3 ? " soon" : ""}">${n} day${n === 1 ? "" : "s"} left</span>`;
        }
        return `<div class="erow"><span class="nm"><i class="dot" style="background:${colorOf(s)}"></i>${esc(s)}</span>
          <input type="date" value="${d}" data-exam="${esc(s)}" aria-label="Exam date for ${esc(s)}">
          ${note}${d ? `<button class="px mini" data-clearexam="${esc(s)}">clear</button>` : ""}</div>`;
      }).join("");
    const next = SUBJECTS.filter(s => exams[s] && daysLeft(exams[s]) >= 0).sort((a, b) => exams[a].localeCompare(exams[b]))[0];
    let head = `<p class="mut" style="margin:0 0 10px">pick an exam date for each subject. days left count from today.</p>`;
    if (next) { const n = daysLeft(exams[next]); head = `<p style="margin:0 0 10px">next exam: <b>${esc(next)}</b> ${n === 0 ? "is today" : "in " + n + " day" + (n === 1 ? "" : "s")}</p>`; }
    app.innerHTML = `<div class="narrow">${back}` + win("timetable.exe", head + rows) + `</div>`;
  }

  function slotRow(t) {
    if (t.id === editId) {
      return `<div class="slot edit" data-edit="${t.id}">
        <input name="title" value="${esc(t.title)}" required maxlength="80" aria-label="Task">
        <select name="subject" aria-label="Subject">${subjOpts(t.subject)}</select>
        <select name="time" aria-label="Time slot">${slotOpts(t.time)}</select>
        <button class="px mini" data-save>save</button><button class="px mini" data-cancel>cancel</button></div>`;
    }
    return `<div class="slot${t.done?" done":""}" data-subject="${esc(t.subject)}">
      <input type="checkbox" data-done="${t.id}"${t.done?" checked":""} aria-label="Mark done: ${esc(t.title)}">
      <span class="t">${fmt(t.time)}</span><span class="nm">${esc(t.title)}</span>
      <span class="tag" style="background:${colorOf(t.subject)}">${esc(t.subject)}</span>
      <button class="px mini" data-edit-btn="${t.id}">edit</button><button class="px mini" data-del="${t.id}">${t.id === delId ? "sure?" : "delete"}</button></div>`;
  }

  function viewPlanner() {
    const days = Array.from({length:7}, (_, i) => addDays(viewStart, i));
    const list = days.map(d => {
      const items = tasks.filter(t => t.date === d).sort((a, b) => a.time.localeCompare(b.time));
      const done = items.filter(t => t.done).length, open = d === openDay;
      const slots = open ? `<div class="slots">${items.map(slotRow).join("") || `<p class="mut" style="margin:0 0 6px">nothing planned yet. add a slot below.</p>`}
        <div class="add" data-date="${d}">
          <input name="title" type="text" placeholder="what to study?" required maxlength="80" aria-label="Task">
          <select name="subject" aria-label="Subject">${subjOpts()}</select>
          <select name="time" aria-label="Time slot">${slotOpts("09:00")}</select>
          <button class="px mini" data-add>+ add</button></div></div>` : "";
      return `<div class="day${open?" open":""}"><button class="dh" data-day="${d}" aria-expanded="${open}">
        <span>${open?"v":">"} ${label(d)}${d===today()?`<b class="now">today</b>`:""}</span>
        <span class="mut">${items.length ? done + "/" + items.length + " done" : "free"}</span></button>${slots}</div>`;
    }).join("");

    const week = `<div class="wk"><button class="px mini" data-wk="-7">&lt; earlier</button><button class="px mini" data-wk="0">today</button>
      <button class="px mini" data-wk="7">later &gt;</button><input type="date" id="jump" value="${viewStart}" aria-label="Jump to date"></div>`;
    const side = SUBJECTS.map(s => `<button class="sub" data-subj="${esc(s)}"><i class="dot" style="background:${colorOf(s)}"></i>${esc(s)}</button>`).join("")
      + `<p class="mut small" style="margin:8px 0 0">hover a subject to light up its slots in the open day. click to pin.</p>`;

    app.innerHTML = back + `<div class="planner"><div>${win("date_wise_todo.exe", week + list)}</div><aside class="side">${win("subjects", side)}</aside></div>`;
    hl(pinned);
  }

  // ---- Subject highlight: dim everything except the chosen subject's slots ----
  function hl(s) {
    document.querySelectorAll(".slot[data-subject]").forEach(el => {
      const on = !!s && el.dataset.subject === s;
      el.classList.toggle("hit", on);
      el.classList.toggle("dim", !!s && !on);
    });
    document.querySelectorAll("[data-subj]").forEach(b => b.classList.toggle("on", b.dataset.subj === s));
  }

  // ---- Router: #home, #progress, #planner ----
  let page = location.hash.slice(1) || "home";
  function go(p) {
    page = p;
    try { location.hash = p; } catch (e) {}
    render();
  }
  function render() {
    (page === "progress" ? viewProgress : page === "planner" ? viewPlanner : page === "timetable" ? viewTimetable : viewHome)();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => {
    const p = location.hash.slice(1) || "home";
    if (p !== page) { page = p; render(); }
  });

  // ---- Clicks, form submits and hover ----
  app.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    const hadDel = delId !== null;
    if (!d.del) delId = null;
    if (d.page) { go(d.page); return; }
    if ("add" in d || "save" in d) { commit(b.closest("[data-date],[data-edit]")); return; }
    if ("go" in d) { go("home"); return; }
    if (d.day) { openDay = openDay === d.day ? null : d.day; editId = null; }
    else if (d.wk !== undefined) {
      const n = Number(d.wk);
      viewStart = n === 0 ? today() : addDays(viewStart, n);
      openDay = n === 0 ? today() : null; editId = null;
    }
    else if (d.del) {
      const id = Number(d.del);
      if (delId !== id) { delId = id; render(); return; }   // first click: ask "sure?"
      tasks = tasks.filter(t => t.id !== id); delId = null; save();  // second click: delete
    }
    else if (d.editBtn) editId = Number(d.editBtn);
    else if (d.clearexam) { delete exams[d.clearexam]; saveExams(); }
    else if ("cancel" in d) editId = null;
    else if (d.subj) { pinned = pinned === d.subj ? null : d.subj; hl(pinned); if (hadDel) render(); return; }
    else return;
    render();
  });

  app.addEventListener("change", e => {
    if (e.target.dataset.done) {
      const t = tasks.find(x => x.id === Number(e.target.dataset.done));
      if (t) { t.done = e.target.checked; save(); render(); }
    } else if (e.target.dataset.exam !== undefined) {
      if (e.target.value) exams[e.target.dataset.exam] = e.target.value; else delete exams[e.target.dataset.exam];
      saveExams(); render();
    } else if (e.target.id === "jump" && e.target.value) {
      viewStart = openDay = e.target.value; editId = null; render();
    }
  });

  // Adds a new task or saves an edit, reading the fields inside the given box
  function commit(box) {
    if (!box) return;
    const field = n => box.querySelector('[name="' + n + '"]');
    const title = field("title").value.trim();
    if (!title) { field("title").focus(); return; }
    if (box.dataset.date) {
      tasks.push({ id: Date.now(), title, subject: field("subject").value, date: box.dataset.date, time: field("time").value, done: false });
    } else if (box.dataset.edit) {
      const t = tasks.find(x => x.id === Number(box.dataset.edit));
      if (t) Object.assign(t, { title, subject: field("subject").value, time: field("time").value });
      editId = null;
    }
    save(); render();
  }

  // Pressing Enter in the task box also adds/saves
  app.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.name === "title") commit(e.target.closest("[data-date],[data-edit]"));
  });

  ["mouseover", "focusin"].forEach(ev => app.addEventListener(ev, e => {
    const b = e.target.closest("[data-subj]"); if (b) hl(b.dataset.subj);
  }));
  ["mouseout", "focusout"].forEach(ev => app.addEventListener(ev, e => {
    if (e.target.closest("[data-subj]")) hl(pinned);
  }));

  render();
</script>
</body>
</html>
